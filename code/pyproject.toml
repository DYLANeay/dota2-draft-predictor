[project]
name = "dota-oracle"
version = "1.2.0"
description = "Dota 2 hero oracle web app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Bao Vien Ngo", email = "bao.ngo@confirmit.com" }]
dependencies = [
    "flask>=3.0",
    "llm-interaction>=0.1.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
dota-oracle = "doracle.app:main"

[project.urls]
Homepage = "https://github.com/baovien/dota-oracle"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doracle"
# The package lives at the repository root, not in src/.
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
